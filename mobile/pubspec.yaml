name: qrpay_bsp
description: Offline-first QRpay demo payments, transfers and vendor tools.
publish_to: none
version: 0.4.0+4
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: 7.1.4
  qr_flutter: 4.1.0
  sqflite: 2.4.2
  path: 1.9.1
  pdf: 3.11.3
  printing: 5.14.2
  share_plus: 11.1.0
  http: 1.5.0
  flutter_secure_storage: 9.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  sqflite_common_ffi: 2.3.6
  sqlite3: 2.9.4
flutter:
  uses-material-design: true
  assets:
    - assets/brand/qrpay_mark.png
    - assets/fonts/OFL.txt
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
