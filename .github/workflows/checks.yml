name: Build Android MVP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: qrpay-android-development-signing-v1
      - name: Generate platform projects and apply launcher icon
        run: python scripts/bootstrap.py
      - name: Check platform boundaries
        run: python scripts/check_project.py
      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze
      - name: Test offline MVP
        working-directory: mobile
        run: flutter test
      - name: Test backup backend
        run: |
          python -m pip install Django==5.2.18
          DEBUG=1 python backend/manage.py test qrpay
      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: QRpay-Android-MVP-v0.4
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
